name: Auth acceptance
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: acceptance
          POSTGRES_DB: acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_CONSUMER_DB: ${{ matrix.database }}
      AUTH_TEST_DATABASE_URL: postgres://postgres:acceptance@127.0.0.1:5432/acceptance
      AUTH_TEST_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install matching PostgreSQL client
        if: matrix.database == 'postgres'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:consumer
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:consumer:integration
      - run: AUTH_CONSUMER_OTP=1 AUTH_CONSUMER_BUNDLER=webpack pnpm test:consumer:integration
      - run: AUTH_CONSUMER_PASSWORD=1 AUTH_CONSUMER_BUNDLER=webpack pnpm test:consumer:integration
        env:
          AUTH_CONSUMER_OTP: ${{ matrix.database == 'postgres' && '1' || '0' }}
      - run: AUTH_CONSUMER_OAUTH=1 AUTH_CONSUMER_BUNDLER=webpack pnpm test:consumer:integration
        env:
          AUTH_CONSUMER_OTP: ${{ matrix.database == 'postgres' && '1' || '0' }}
      - run: pnpm test:integration:acceptance
      - run: pnpm test:migration:acceptance
