name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'MAIN-12/auth-login-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate release tag and package
        run: node scripts/validate-release-tag.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.19.0
      - name: Install OIDC-capable npm
        run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - name: Verify packed-package consumer
        run: pnpm test:consumer
      - name: Check, pack, and publish with OIDC
        run: pnpm release:publish
