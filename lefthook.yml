# Standard ** semantics also match files directly inside src/ and tests/.
glob_matcher: doublestar

pre-commit:
  # Stop on failure and never run two writers on the same staged file at once.
  piped: true
  commands:
    frozen-lockfile:
      priority: 1
      glob:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - pnpm.yaml
        - .npmrc
      run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
    prettier:
      priority: 2
      glob: '**/*.{js,jsx,ts,tsx,mjs,cjs,json,css,scss,html,md,mdx,yml,yaml,svg}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    eslint:
      priority: 3
      glob:
        - 'src/**/*.{js,jsx,ts,tsx,mjs,cjs}'
        - 'tests/**/*.{js,jsx,ts,tsx,mjs,cjs}'
        - 'scripts/**/*.ts'
      exclude: tests/evidence/**
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
